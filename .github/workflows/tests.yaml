name: Morrigan CI Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

# Push and PR CI: unit + smoke tiers only, on ubuntu + macos x py 3.11/3.12.
# Targets <10 min wall. The integration and slow tiers run seed-ensemble
# statistics over many full-system runs and live in the scheduled nightly workflow
# `nightly.yml` instead. Coverage measurement is canonical in nightly;
# the Codecov dashboard updates from nightly's separate upload step.

permissions:
  contents: read

jobs:
  test:
    name: Morrigan-check
    strategy:
      fail-fast: false
      # Draft PRs run only ubuntu-latest / Python 3.11 for fast signal on the
      # gating steps (validator, linter, ratchet, one test pass). Non-draft
      # events (ready_for_review, push to main, workflow_dispatch) get the
      # full ubuntu + macos x Python 3.11 / 3.12 matrix.
      matrix:
        os: ${{ github.event.pull_request.draft == true && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        python-version: ${{ github.event.pull_request.draft == true && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v5
        id: cache-virtualenv
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[develop]"

      - name: Validate test markers
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
        run: bash tools/validate_test_structure.sh

      - name: Run test-quality lint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
        run: python tools/check_test_quality.py --check

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
        run: |
          # Pinned to the same version the pre-commit hook uses. An unpinned
          # install lets a future ruff release change the formatter's output and
          # silently disagree with what contributors run locally.
          python -m pip install ruff==0.15.12
          ruff check src/ tests/ tools/ plot.py
          ruff format --check src/ tests/ tools/ plot.py

      - name: Pre-flight fail_under ratchet check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Reject PRs that lower either coverage gate: the full gate
          # [tool.coverage.report].fail_under and the fast gate
          # [tool.morrigan.coverage_fast].fail_under, the one that
          # blocks every PR. The floor is min(base, 90.0): a one-time
          # ratchet down to the ceiling is allowed, but any drop below
          # it is blocked so neither gate can be weakened to land an
          # under-tested change.
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          base_ref = os.environ.get('BASE_REF', 'main')
          out = subprocess.run(
              ['git', 'show', f'origin/{base_ref}:pyproject.toml'],
              capture_output=True,
              text=True,
              check=False,
          )
          if out.returncode != 0:
              print(f'Could not read pyproject.toml from origin/{base_ref}; skipping check.')
              sys.exit(0)

          base = tomllib.loads(out.stdout)
          head = tomllib.loads(pathlib.Path('pyproject.toml').read_text())

          GATES = {
              'tool.coverage.report.fail_under':
                  lambda d: d['tool']['coverage']['report']['fail_under'],
              'tool.morrigan.coverage_fast.fail_under':
                  lambda d: d['tool']['morrigan']['coverage_fast']['fail_under'],
          }
          ECOSYSTEM_CEILING = 90.0

          for name, getter in GATES.items():
              try:
                  base_v = float(getter(base))
              except KeyError:
                  base_v = None
              try:
                  head_v = float(getter(head))
              except KeyError:
                  head_v = None
              print(f'{name}: base={base_v} head={head_v}')

              # Base has no gate: nothing to ratchet against. The first
              # PR that introduces the gate is allowed regardless.
              if base_v is None:
                  print(f'origin/{base_ref} has no {name}; no ratchet to enforce.')
                  continue

              # Head removed a gate that base had: that is a decrease.
              if head_v is None:
                  print(f'ERROR: head removed {name} (base had {base_v}). '
                        'The gate is one-way only.')
                  sys.exit(1)

              floor = min(base_v, ECOSYSTEM_CEILING)
              if head_v < floor:
                  print(f'ERROR: {name} {head_v} < floor {floor} '
                        f'(base={base_v}, ceiling={ECOSYSTEM_CEILING}). '
                        'The gate may ratchet down to the ceiling but not below.')
                  sys.exit(1)
              if head_v > ECOSYSTEM_CEILING:
                  print(f'ERROR: {name} {head_v} exceeds the '
                        f'{ECOSYSTEM_CEILING}% ecosystem ceiling.')
                  sys.exit(1)
              print(f'OK: {name} {head_v} within [{floor}, {ECOSYSTEM_CEILING}].')
          PY

      - name: Run unit + smoke tests
        run: |
          FAST_FAIL_UNDER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['morrigan']['coverage_fast']['fail_under'])")
          echo "Fast gate fail_under: ${FAST_FAIL_UNDER}%"
          pytest -m "(unit or smoke) and not skip and not slow and not integration" \
            --cov=morrigan \
            --cov-fail-under=${FAST_FAIL_UNDER}
